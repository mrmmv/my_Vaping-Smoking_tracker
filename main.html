<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smoking Detection Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f0f8ff; /* Light blue background */
            font-family: 'Arial', sans-serif;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            position: relative;
        }

        header {
            position: relative;
            z-index: 2;
            background-color: #001f3f; /* Navy blue */
            padding: 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 50px;
            height: 50px;
        }

        .logout {
            position: absolute;
            right: 20px;
            display: flex;
            align-items: center;
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .logout:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .logout img {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }

        .dashboard {
            position: relative;
            z-index: 2;
            display: flex;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px; /* Space for footer */
        }

        .section {
            background: white; /* White background */
            border-radius: 15px;
            padding: 20px;
            width: 30%;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .section:hover {
            transform: translateY(-5px);
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.3);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th, .data-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        .data-table th {
            background-color: #001f3f; /* Navy blue */
            color: white;
        }

        #recent-image {
            width: 100%;
            height: auto;
            border-radius: 15px;
            cursor: pointer;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        #recent-image:hover {
            transform: scale(1.05);
        }

        .view-all-btn {
            background-color: #001f3f; /* Navy blue */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .view-all-btn:hover {
            background-color: #003366; /* Darker navy blue */
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 3;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 1200px;
            position: relative;
        }

        .close {
            color: #333;
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
        }

        .close:hover {
            color: #001f3f; /* Navy blue */
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .image-grid img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .image-grid img:hover {
            transform: scale(1.05);
        }

        .image-modal {
            display: none;
            position: fixed;
            z-index: 4;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }

        .image-modal-close {
            color: white;
            position: absolute;
            top: 20px;
            right: 35px;
            font-size: 40px;
            cursor: pointer;
        }

        .image-modal-close:hover {
            color: #001f3f; /* Navy blue */
        }

        .download-btn {
            background-color: #001f3f; /* Navy blue */
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .download-btn:hover {
            background-color: #003366; /* Darker navy blue */
        }

        footer {
            text-align: center;
            padding: 10px 0;
            font-size: 0.9em;
            color: #001f3f; /* Navy blue */
            width: 100%;
            margin-top: auto; /* Push footer to the bottom */
        }

        @media (max-width: 768px) {
            .dashboard {
                flex-direction: column;
                align-items: center;
            }

            .section {
                width: 100%;
                max-width: 400px;
            }

            .view-all-btn {
                width: 100%;
            }

            .download-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <img src="https://cdn-icons-png.flaticon.com/256/998/998699.png" alt="No Smoking Logo" class="logo">
        <h1>Smoking Detection Dashboard</h1>
        <a href="index.html" class="logout">
            <img src="https://cdn-icons-png.flaticon.com/512/1828/1828479.png" alt="Logout Icon">
            Logout
        </a>
    </header>

    <div class="dashboard">
        <div class="section">
            <h2>Data History</h2>
            <table class="data-table" id="data-history-table">
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Location</th>
                        <th>Confidence Level</th>
                    </tr>
                </thead>
                <tbody id="data-table-body"></tbody>
            </table>
            <button class="view-all-btn" onclick="viewAllData()">View All</button>
        </div>
        <div class="section">
            <h2>Recent Image</h2>
            <img id="recent-image" src="" alt="Recent Image">
            <p id="recent-image-time"></p>
            <p id="recent-image-location"></p>
            <button class="view-all-btn" onclick="viewAllImages()">View All</button>
        </div>
    </div>

    <!-- Modal for viewing all data -->
    <div id="data-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeDataModal()">&times;</span>
            <h2>All Data History</h2>
            <table class="data-table" id="all-data-table">
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Location</th>
                        <th>Confidence Level</th>
                    </tr>
                </thead>
                <tbody id="all-data-table-body"></tbody>
            </table>
            <button class="view-all-btn" onclick="downloadData()">Download Data</button>
        </div>
    </div>

    <!-- Modal for viewing all images -->
    <div id="images-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeImagesModal()">&times;</span>
            <h2>All Images</h2>
            <div class="image-grid" id="image-grid"></div>
        </div>
    </div>

    <!-- Modal for viewing individual image -->
    <div id="image-modal" class="image-modal">
        <span class="image-modal-close" onclick="closeImageModal()">&times;</span>
        <img class="image-modal-content" id="modal-image">
    </div>

    <footer>
        Powered by: AI Smoking Detection © 2025
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.16.9/xlsx.full.min.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBmWpORtzUDjJaq_BW-Qsv69xYl6yJE2do",
            authDomain: "gamefi-integer.firebaseapp.com",
            databaseURL: "https://gamefi-integer-default-rtdb.firebaseio.com",
            projectId: "gamefi-integer",
            storageBucket: "gamefi-integer.firebasestorage.app",
            messagingSenderId: "1001928239471",
            appId: "1:1001928239471:web:337f34480a33d6ae21a09a"
        };
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function fetchDashboardData() {
            const dataRef = db.ref('smoking_detections');
            dataRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                const keys = Object.keys(data).reverse();
                const tableBody = document.getElementById('data-table-body');
                tableBody.innerHTML = '';

                keys.slice(0, 5).forEach((key) => {
                    const entry = data[key];
                    const confidencePercent = (entry.confidence * 100).toFixed(2);
                    const row = `<tr>
                                    <td>${entry.timestamp}</td>
                                    <td>${entry.location}</td>
                                    <td>${confidencePercent}%</td>
                                </tr>`;
                    tableBody.innerHTML += row;
                });

                if (keys.length > 0) {
                    const recentData = data[keys[0]];
                    document.getElementById('recent-image').src = `data:image/jpeg;base64,${recentData.image_base64}`;
                    document.getElementById('recent-image-time').innerText = `Captured on: ${recentData.timestamp}`;
                    document.getElementById('recent-image-location').innerText = `Location: ${recentData.location}`;
                }
            });
        }

        function viewAllData() {
            const dataRef = db.ref('smoking_detections');
            dataRef.once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                const keys = Object.keys(data).reverse();
                const tableBody = document.getElementById('all-data-table-body');
                tableBody.innerHTML = '';

                keys.forEach((key) => {
                    const entry = data[key];
                    const confidencePercent = (entry.confidence * 100).toFixed(2);
                    const row = `<tr>
                                    <td>${entry.timestamp}</td>
                                    <td>${entry.location}</td>
                                    <td>${confidencePercent}%</td>
                                </tr>`;
                    tableBody.innerHTML += row;
                });

                document.getElementById('data-modal').style.display = 'block';
            });
        }

        function closeDataModal() {
            document.getElementById('data-modal').style.display = 'none';
        }

        function downloadData() {
            const table = document.getElementById('all-data-table');
            const ws = XLSX.utils.table_to_sheet(table);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data History");
            XLSX.writeFile(wb, "data_history.xlsx");
        }

        function viewAllImages() {
            const dataRef = db.ref('smoking_detections');
            dataRef.once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                const keys = Object.keys(data).reverse();
                const imageGrid = document.getElementById('image-grid');
                imageGrid.innerHTML = '';

                keys.forEach((key) => {
                    const entry = data[key];
                    const image = document.createElement('img');
                    image.src = `data:image/jpeg;base64,${entry.image_base64}`;
                    image.alt = `Image captured on ${entry.timestamp}`;
                    image.onclick = () => openImageModal(entry.image_base64, entry.timestamp, entry.confidence);
                    const imageContainer = document.createElement('div');
                    imageContainer.innerHTML = `<p>${entry.timestamp} - Confidence: ${(entry.confidence * 100).toFixed(2)}%</p>`;
                    const downloadBtn = document.createElement('button');
                    downloadBtn.innerText = 'Download';
                    downloadBtn.className = 'download-btn';
                    downloadBtn.onclick = () => downloadImage(entry.image_base64, entry.timestamp, entry.confidence);
                    imageContainer.appendChild(image);
                    imageContainer.appendChild(downloadBtn);
                    imageGrid.appendChild(imageContainer);
                });

                document.getElementById('images-modal').style.display = 'block';
            });
        }

        function closeImagesModal() {
            document.getElementById('images-modal').style.display = 'none';
        }

        function openImageModal(imageBase64, timestamp, confidence) {
            const modalImage = document.getElementById('modal-image');
            modalImage.src = `data:image/jpeg;base64,${imageBase64}`;
            modalImage.alt = `Image captured on ${timestamp} - Confidence: ${(confidence * 100).toFixed(2)}%`;
            document.getElementById('image-modal').style.display = 'flex';
        }

        function closeImageModal() {
            document.getElementById('image-modal').style.display = 'none';
        }

        function downloadImage(imageBase64, timestamp, confidence) {
            const link = document.createElement('a');
            link.href = `data:image/jpeg;base64,${imageBase64}`;
            const confidencePercent = (confidence * 100).toFixed(2);
            link.download = `Smoking_Detection_${timestamp.replace(/[: ]/g, '_')}_Confidence_${confidencePercent}%.jpg`;
            link.click();
        }

        window.onload = () => {
            fetchDashboardData();
        };
    </script>

</body>

</html>
