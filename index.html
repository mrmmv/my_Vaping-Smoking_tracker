<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Register</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        .login-box, .register-box, .reset-box {
            background-color: white;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo {
            width: 200px;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 20px;
            color: #1877F2;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #606770;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #1877F2;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1877F2;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #166fe5;
        }

        .message {
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background-color: #ffebe8;
            border: 1px solid #ff3b30;
            color: #ff3b30;
        }

        .message.success {
            background-color: #e8f5e9;
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .link {
            text-align: center;
            margin-top: 15px;
        }

        .link a {
            color: #1877F2;
            text-decoration: none;
            font-size: 14px;
        }

        .link a:hover {
            text-decoration: underline;
        }

        /* Media queries for mobile responsiveness */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .login-box, .register-box, .reset-box {
                padding: 15px;
            }

            .logo {
                width: 150px;
            }

            h2 {
                font-size: 20px;
            }

            button {
                font-size: 14px;
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .login-box, .register-box, .reset-box {
                padding: 10px;
            }

            .logo {
                width: 120px;
            }

            h2 {
                font-size: 18px;
            }

            button {
                font-size: 14px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Box -->
    <div class="login-box" id="login-box">
        <img src="https://static.xx.fbcdn.net/rsrc.php/y8/r/dF5SId3UHWd.svg" alt="Facebook Logo" class="logo">
        <h2>Log in to Facebook</h2>
        <div class="input-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Enter your password" required>
        </div>
        <button onclick="loginUser()">Log In</button>
        <div class="message" id="login-message"></div>
        <div class="link">
            <a href="#" onclick="showReset()">Forgot Password?</a>
        </div>
        <div class="link">
            <a href="#" onclick="showRegister()">Create New Account</a>
        </div>
    </div>

    <!-- Register Box (Initially hidden) -->
    <div class="register-box" id="register-box" style="display: none;">
        <img src="https://static.xx.fbcdn.net/rsrc.php/y8/r/dF5SId3UHWd.svg" alt="Facebook Logo" class="logo">
        <h2>Sign Up</h2>
        <div class="input-group">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" placeholder="Enter your password" required>
        </div>
        <button onclick="registerUser()">Sign Up</button>
        <div class="message" id="register-message"></div>
        <div class="link">
            <a href="#" onclick="showLogin()">Already have an account? Log In</a>
        </div>
    </div>

    <!-- Reset Password Box (Initially hidden) -->
    <div class="reset-box" id="reset-box" style="display: none;">
        <img src="https://static.xx.fbcdn.net/rsrc.php/y8/r/dF5SId3UHWd.svg" alt="Facebook Logo" class="logo">
        <h2>Reset Password</h2>
        <div class="input-group">
            <label for="reset-email">Email</label>
            <input type="email" id="reset-email" placeholder="Enter your email" required>
        </div>
        <button onclick="resetPassword()">Reset Password</button>
        <div class="message" id="reset-message"></div>
        <div class="link">
            <a href="#" onclick="showLogin()">Back to Log In</a>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
    // Firebase configuration (replace with your actual Firebase project config)
    const firebaseConfig = {
        apiKey: "AIzaSyAeHJM-GN1rQ5ETxKc2uJcb4Btm2WixXf8",
        authDomain: "smoke-vape-detection.firebaseapp.com",
        projectId: "smoke-vape-detection",
        storageBucket: "smoke-vape-detection.appspot.com",
        messagingSenderId: "844611007661",
        appId: "1:844611007661:web:7568a7e7028e1174a0c224"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Login user
    function loginUser() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                // Redirect to main.page if login is successful
                window.location.href = "main.html";
            })
            .catch((error) => {
                showMessage('login-message', error.message, 'error');
            });
    }

    // Register user
    function registerUser() {
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;

        auth.createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                showMessage('register-message', "Registration successful!", 'success');
            })
            .catch((error) => {
                showMessage('register-message', error.message, 'error');
            });
    }

    // Reset password
    function resetPassword() {
        const email = document.getElementById('reset-email').value;

        auth.sendPasswordResetEmail(email)
            .then(() => {
                showMessage('reset-message', "Password reset email sent!", 'success');
            })
            .catch((error) => {
                showMessage('reset-message', error.message, 'error');
            });
    }

    // Show message
    function showMessage(elementId, message, type) {
        const messageElement = document.getElementById(elementId);
        messageElement.textContent = message;
        messageElement.className = `message ${type}`;
        messageElement.style.display = 'block';
    }

    // Switch to register form
    function showRegister() {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('register-box').style.display = 'block';
        document.getElementById('reset-box').style.display = 'none';
    }

    // Switch to login form
    function showLogin() {
        document.getElementById('login-box').style.display = 'block';
        document.getElementById('register-box').style.display = 'none';
        document.getElementById('reset-box').style.display = 'none';
    }

    // Switch to reset password form
    function showReset() {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('register-box').style.display = 'none';
        document.getElementById('reset-box').style.display = 'block';
    }
</script>
</body>
</html>
